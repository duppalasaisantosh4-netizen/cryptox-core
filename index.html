const eventSource = new EventSource('onrender.com');
let trueWalletBal = 0.00; let bonusWalletBal = 0.00;
let dailyTaps = 0; let taskTaps = 0;
let roomStates = {
TON: { hasBet: false, amt: 0, pts: [], color: '#00a6ff', isCashedOut: false, cashedOutY: 0, offsetX: 0 },
NOT: { hasBet: false, amt: 0, pts: [], color: '#eab308', isCashedOut: false, cashedOutY: 0, offsetX: 0 },
XCOIN: { hasBet: false, amt: 0, pts: [], color: '#d97706', isCashedOut: false, cashedOutY: 0, offsetX: 0 }
};
let audioCtx = null;
function initAudio() { if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
function playSynthSound(freq, type, duration, vol) {
initAudio(); try {
const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
gain.gain.setValueAtTime(vol, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
} catch(e) {}
}
function playTapSound() { playSynthSound(880, 'sine', 0.08, 0.2); }
function playCashoutSound() { playSynthSound(587.33, 'triangle', 0.15, 0.25); setTimeout(() => playSynthSound(880, 'triangle', 0.25, 0.25), 80); }
function playCrashSound() { playSynthSound(120, 'sawtooth', 0.4, 0.3); }
function triggerCashoutHUDAlert(amount) {
const anchor = document.getElementById('wallet-anchor-zone');
const alertBox = document.createElement('div');
alertBox.className = 'prize-floater-alert';
alertBox.innerHTML = 💰 +$${amount};
alertBox.style.right = '20px';
alertBox.style.top = '10px';
anchor.appendChild(alertBox);
setTimeout(() => alertBox.remove(), 800);
}
function triggerModal(type) {
document.getElementById('modal-header-text').innerText = type + " Dashboard Terminal";
if (type === 'Deposit') {
document.getElementById('modal-body-content').innerText = "⚠️ SYSTEM ERROR: Payout lane parameters un-initialized.\n\nTo wire real deposit addresses natively to your live Supabase wallets, we must link your official Tonkeeper public address key string next.";
} else if (type === 'Withdraw') {
document.getElementById('modal-body-content').innerText = "⚠️ Payout barrier gate locked.\n\nMinimum manual withdrawal amount threshold is configured to $5.00 worth of TON network liquidity assets.";
} else {
document.getElementById('modal-body-content').innerText = "Connecting secure data tracks to your live ledger. Current logs: 0 transaction rows recorded.";
}
document.getElementById('system-modal').style.display = 'flex';
}
function closeModal() { document.getElementById('system-modal').style.display = 'none'; }
function switchPage(num) {
document.getElementById('page-1').classList.toggle('active-page', num === 1);
document.getElementById('page-2').classList.toggle('active-page', num === 2);
}
document.getElementById('x-node-core').onclick = (e) => {
if(dailyTaps >= 300) return; dailyTaps++; taskTaps++; playTapSound();
document.getElementById('daily-text-val').innerText = dailyTaps + ' / 300';
document.getElementById('daily-progress-bar').style.width = (dailyTaps / 300 * 100) + '%';
document.getElementById('task-text-val').innerText = taskTaps + ' / 10';
document.getElementById('task-progress-bar').style.width = (taskTaps / 10 * 100) + '%';
const floatItem = document.createElement('div'); floatItem.className = 'float-part'; floatItem.innerText = '💰 +$';
floatItem.style.left = (e.clientX - 20) + 'px'; floatItem.style.top = (e.clientY - 40) + 'px';
floatItem.style.position = 'fixed'; document.body.appendChild(floatItem); setTimeout(() => floatItem.remove(), 500);
if(taskTaps >= 10) {
taskTaps = 0; document.getElementById('task-text-val').innerText = '0 / 10'; document.getElementById('task-progress-bar').style.width = '0%';
fetch('/credit-tap').then(r => r.json()).then(data => {
bonusWalletBal = (parseFloat(bonusWalletBal) + data.credit).toFixed(2);
document.getElementById('bonus-wallet-display').innerText = bonusWalletBal;
});
}
};
function drawCurve(coin, multiplier) {
const canvas = document.getElementById('canvas-' + coin); if(!canvas) return;
const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
let state = roomStates[coin];
if(multiplier <= 1.00) { state.pts = []; state.offsetX = 0; return; }
let targetX = (multiplier - 1.00) * 55 + 20;
if (targetX > canvas.width - 60) { state.offsetX = targetX - (canvas.width - 60); }
ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
let gridGap = 40;
let startX = 30 - (state.offsetX % gridGap);
for(let i = startX; i < canvas.width; i += gridGap) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
let currentX = Math.min(targetX - state.offsetX, canvas.width - 20);
let currentY = canvas.height - Math.min((multiplier - 1.00) * 14 + 12, canvas.height - 12);
if (state.hasBet && state.isCashedOut) { currentY = state.cashedOutY; }
state.pts.push({ rawX: targetX, y: currentY });
ctx.beginPath(); ctx.strokeStyle = state.color; ctx.lineWidth = 3;
let first = true;
state.pts.forEach(pt => {
let renderX = pt.rawX - state.offsetX;
if (renderX >= 0 && renderX <= canvas.width) {
if (first) { ctx.moveTo(renderX, pt.y); first = false; }
else { ctx.lineTo(renderX, pt.y); }
}
});
ctx.stroke();
}
function getRiskClass(mult) {
if (mult < 2.00) return 'pill-red';
if (mult < 5.00) return 'pill-green';
if (mult < 10.00) return 'pill-pink';
if (mult < 35.00) return 'pill-yellow';
return 'pill-orange';
}

function triggerProvablyFairLogs(coin, mult, hash) {
let explainText = `🛡️ PROVABLY FAIR VERIFICATION
Asset Arena: ${coin}
Round Result: ${parseFloat(mult).toFixed(2)}x
[HOW IT WORKS]:
The ending crash value is pre-calculated using standard HMAC SHA-256 protocols before bets are placed. This creates an encrypted commitment.
Status: Verified Fair Ledger Lock.`;
alert(explainText);
}
function renderHistory(coin, historyArr) {
const strip = document.getElementById('hist-' + coin); if(!strip) return; strip.innerHTML = '';
historyArr.slice(0, 15).forEach(item => {
const pill = document.createElement('span');
pill.className = 'hist-pill ' + getRiskClass(item.mult);
pill.innerText = parseFloat(item.mult).toFixed(2) + 'x';
pill.onclick = () => triggerProvablyFairLogs(coin, item.mult, item.hash);
strip.appendChild(pill);
});
}
eventSource.onmessage = function(event) {
const data = JSON.parse(event.data); let coin = data.asset; if(!roomStates[coin]) return;
const valText = document.getElementById('val-' + coin); const btn = document.getElementById('btn-' + coin); const input = document.getElementById('input-' + coin);
switch(data.type) {
case 'COUNTDOWN':
valText.innerText = data.seconds + 's'; valText.style.color = '#d97706';
if(!roomStates[coin].hasBet) { btn.innerText = 'OPEN MARGIN'; btn.style.background = 'linear-gradient(180deg, #334155, #1e293b)'; btn.disabled = false; input.disabled = false; }
break;
case 'TAKEOFF':
input.disabled = true;
if(roomStates[coin].hasBet) { btn.innerText = 'CASH OUT POSITION'; btn.style.background = 'linear-gradient(180deg, #3b82f6, #1d4ed8)'; btn.disabled = false; }
else { btn.innerText = 'SPECTATING'; btn.style.background = '#e2e8f0'; btn.disabled = true; }
break;
case 'TICK':
valText.innerText = data.multiplier.toFixed(2) + 'x'; valText.style.color = '#10b981'; drawCurve(coin, data.multiplier);
break;
case 'GAME_LIQUIDATED':
playCrashSound(); valText.innerText = data.finalMultiplier.toFixed(2) + 'x'; valText.style.color = '#ef4444';
btn.innerText = 'LIQUIDATED'; btn.style.background = '#cbd5e1'; btn.disabled = true;
roomStates[coin].hasBet = false; roomStates[coin].isCashedOut = false; drawCurve(coin, 1.00); if(data.history) renderHistory(coin, data.history);
break;
}
};
['TON', 'NOT', 'XCOIN'].forEach(coin => {
const btn = document.getElementById('btn-' + coin); const input = document.getElementById('input-' + coin);
btn.onclick = function() {
initAudio();
if(btn.innerText.includes('OPEN')) {
let amt = parseFloat(input.value); if(amt > bonusWalletBal || amt <= 0) return;
bonusWalletBal = (bonusWalletBal - amt).toFixed(2); document.getElementById('bonus-wallet-display').innerText = bonusWalletBal;
roomStates[coin].hasBet = true; roomStates[coin].amt = amt; roomStates[coin].isCashedOut = false;
fetch('/place-bet?asset=' + coin + '&amount=' + amt); btn.innerText = 'POSITION SECURED'; btn.style.background = '#cbd5e1'; btn.disabled = true;
} else if(btn.innerText.includes('CASH')) {
playCashoutSound();
fetch('/cashout?asset=' + coin).then(r => r.json()).then(res => {
if(res.status === 'SUCCESS') {
trueWalletBal = (parseFloat(trueWalletBal) + res.winAmount).toFixed(2);
document.getElementById('true-wallet-display').innerText = trueWalletBal;
triggerCashoutHUDAlert(res.winAmount);
btn.innerText = 'FILLED +' + res.winAmount; btn.style.background = '#cbd5e1'; btn.disabled = true;
let state = roomStates[coin]; state.isCashedOut = true;
const canvas = document.getElementById('canvas-' + coin);
if(state.pts.length > 0 && canvas) { state.cashedOutY = state.pts[state.pts.length - 1].y; }
}
});
}
};
