<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Crypto X - Tap to Earn and Crash Trading</title>
<meta name="description" content="Crypto X Telegram Mini-App: tap the golden coin to mine bonus credit and trade live TON, NOT and X-Coin crash rounds with provably fair SHA-256 results.">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --app-h: 100dvh;
    --bg: #0a0e17;
    --panel: #131a28;
    --line: #232c3d;
    --text: #e8ecf4;
    --muted: #8b95a7;
    --gold: #f5b301;
    --orange: #ff7a00;
    --green: #19d27a;
    --red: #ff3b5c;
    --blue: #1f7bff;
    --floor: #d5d9df;
    --ink: #111827;
    --coin: min(56vw, calc(var(--app-h) * 0.29), 230px);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    touch-action: manipulation !important;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    position: fixed;
    inset: 0;
  }

  button, input {
    font: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  button:disabled {
    cursor: default;
  }

  #app {
    height: var(--app-h);
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    background: radial-gradient(120% 60% at 50% 0%, #1a2336 0%, var(--bg) 60%);
  }

  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px 6px;
  }

  .logo {
    display: block;
    width: 152px;
    height: auto;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
  }

  .net-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: #121927;
    border: 1px solid var(--line);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .net-chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }

  .net-chip[data-mode="live"] { color: #7dffb8; }
  .net-chip[data-mode="live"]::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .net-chip[data-mode="demo"] { color: #ffd27a; }
  .net-chip[data-mode="demo"]::before { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .net-chip[data-mode="reconnecting"] { color: #ff9aac; }
  .net-chip[data-mode="reconnecting"]::before { background: var(--red); }

  .hud {
    flex: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 12px 8px;
  }

  .hud-col {
    min-width: 0;
    border-radius: 14px;
    padding: 9px 10px;
    background: linear-gradient(160deg, #182033 0%, #0d121c 100%);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hud-title {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: #d5dcea;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hud-sub {
    margin-top: -4px;
    font-size: 9.5px;
    color: var(--muted);
  }

  .card-strip {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #9fb0cc;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .card-strip svg {
    flex: none;
    width: 24px;
    height: 18px;
  }

  .hud-actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
  }

  .hud-link {
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 6px 4px;
    border-radius: 9px;
    color: #0a0e17;
    background: linear-gradient(180deg, #ffe07a, #f5b301);
    box-shadow: 0 2px 0 #9a6a00;
  }

  .hud-link.secondary {
    color: #e8ecf4;
    background: #1f2738;
    box-shadow: 0 2px 0 #070a10;
    border: 1px solid #2d374b;
  }

  .hud-link:active {
    transform: translateY(2px);
    box-shadow: none;
  }

  .bal-row {
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .bal-label {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .bal {
    font-size: 15px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    transition: transform 0.18s ease;
  }

  .bal.green { color: var(--green); text-shadow: 0 0 10px rgba(25, 210, 122, 0.35); }
  .bal.red { color: var(--red); text-shadow: 0 0 10px rgba(255, 59, 92, 0.35); }
  .bal.bump { transform: scale(1.12); }

  .pages {
    flex: 1;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }

  .track {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.38s cubic-bezier(0.22, 0.9, 0.24, 1);
    will-change: transform;
  }

  .track.show-arena {
    transform: translateX(-50%);
  }

  .page {
    width: 50%;
    height: 100%;
    min-height: 0;
  }

  .page-mine {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 2px 12px calc(12px + env(safe-area-inset-bottom));
  }

  .meters {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 10px 12px;
    border-radius: 14px;
    background: #10161f;
    border: 1px solid var(--line);
  }

  .meter-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 11px;
    font-weight: 800;
    color: #ffcf9a;
    letter-spacing: 0.03em;
  }

  .meter-label span:last-child {
    font-variant-numeric: tabular-nums;
    color: #ffffff;
  }

  .meter {
    position: relative;
    height: 10px;
    border-radius: 999px;
    overflow: hidden;
    background: #1b2231;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
  }

  .meter-fill {
    position: relative;
    height: 100%;
    width: 0%;
    border-radius: inherit;
    background: linear-gradient(90deg, #ff2e00 0%, #ff7a00 55%, #ffb300 100%);
    box-shadow: 0 0 12px rgba(255, 110, 0, 0.75);
    transition: width 0.18s ease-out;
    overflow: hidden;
  }

  .meter-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.22) 0 6px, rgba(255, 255, 255, 0) 6px 12px);
    background-size: 17px 17px;
    animation: stripes 0.8s linear infinite;
  }

  @keyframes stripes {
    to { background-position: 17px 0; }
  }

  .coin-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 700px;
  }

  .coin-stage::before {
    content: "";
    position: absolute;
    width: calc(var(--coin) * 1.5);
    height: calc(var(--coin) * 1.5);
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 190, 40, 0.28), rgba(255, 190, 40, 0));
    pointer-events: none;
  }

  .coin-wrap {
    position: relative;
    width: var(--coin);
    height: calc(var(--coin) + 14px);
    display: flex;
    justify-content: center;
  }

  .coin-shadow {
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: calc(var(--coin) * 0.86);
    height: calc(var(--coin) * 0.2);
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0));
    pointer-events: none;
  }

  .coin {
    position: relative;
    width: var(--coin);
    height: var(--coin);
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fffbe0 0%, #ffe27a 14%, #f9c21a 38%, #e09a00 66%, #a86b00 100%);
    transform: rotateX(30deg) rotateZ(-10deg);
    transform-origin: 50% 50%;
    box-shadow:
      0 1px 0 #c78600, 0 2px 0 #c08000, 0 3px 0 #b87a00, 0 4px 0 #b07300,
      0 5px 0 #a86d00, 0 6px 0 #a06700, 0 7px 0 #976000, 0 8px 0 #8e5a00,
      0 9px 0 #855300, 0 10px 0 #7b4c00, 0 11px 0 #704500, 0 12px 0 #653e00,
      inset 0 0 0 3px rgba(255, 240, 170, 0.55),
      inset 0 -10px 20px rgba(120, 70, 0, 0.45);
    outline: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .coin:focus-visible {
    outline: 3px solid #ffd24a;
    outline-offset: 6px;
  }

  .coin.is-locked {
    filter: grayscale(0.65) brightness(0.8);
  }

  .coin-rim {
    position: absolute;
    inset: 9%;
    border-radius: 50%;
    border: 3px solid rgba(150, 95, 0, 0.55);
    box-shadow: inset 0 2px 0 rgba(255, 250, 210, 0.7), 0 1px 0 rgba(255, 250, 210, 0.6);
    background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.09) 0deg 6deg, rgba(0, 0, 0, 0.04) 6deg 12deg);
    pointer-events: none;
  }

  .coin-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--coin) * 0.46);
    font-weight: 900;
    line-height: 1;
    color: #d99200;
    text-shadow: 0 -2px 0 #8a5600, 0 2px 0 #fff1b0, 0 0 18px rgba(255, 230, 140, 0.5);
    pointer-events: none;
  }

  .coin::after {
    content: "";
    position: absolute;
    inset: 5% 20% 54% 14%;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0));
    transform: rotate(-18deg);
    pointer-events: none;
  }

  .coin-hint {
    margin: 14px 0 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .floater-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 5;
  }

  .floater {
    position: absolute;
    white-space: nowrap;
    font-size: 18px;
    font-weight: 900;
    color: #ffd24a;
    text-shadow: 0 2px 0 #7a4a00, 0 0 12px rgba(255, 180, 0, 0.6);
    animation: floatUp 0.9s ease-out forwards;
    will-change: transform, opacity;
  }

  .floater.big {
    font-size: 22px;
    color: #7dffb0;
    text-shadow: 0 2px 0 #075a2c, 0 0 14px rgba(25, 210, 122, 0.7);
    animation-duration: 1.3s;
  }

  .floater.limit {
    font-size: 14px;
    color: #ff9aac;
    text-shadow: 0 2px 0 #4a0010;
  }

  @keyframes floatUp {
    0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
    15% { transform: translate(-50%, -80%) scale(1.12); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx, 0px)), -170px) scale(1); opacity: 0; }
  }

  .launch-btn {
    flex: none;
    position: relative;
    width: 100%;
    height: 60px;
    border: 0;
    border-radius: 16px;
    color: #2a1100;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.16em;
    background: linear-gradient(180deg, #ffe066 0%, #ffbd1a 44%, #ff7a00 45%, #ff5400 100%);
    box-shadow:
      0 6px 0 #a33400,
      0 12px 22px rgba(255, 90, 0, 0.35),
      inset 0 2px 0 rgba(255, 255, 255, 0.7),
      inset 0 -3px 0 rgba(120, 30, 0, 0.35);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .launch-btn:active {
    transform: translateY(4px);
    box-shadow:
      0 2px 0 #a33400,
      0 5px 12px rgba(255, 90, 0, 0.3),
      inset 0 2px 0 rgba(255, 255, 255, 0.7),
      inset 0 -3px 0 rgba(120, 30, 0, 0.35);
  }

  .launch-btn small {
    display: block;
    margin-top: 2px;
    font-size: 9px;
    letter-spacing: 0.22em;
    font-weight: 800;
    opacity: 0.7;
  }

  .page-arena {
    display: flex;
    flex-direction: column;
    background: var(--floor);
    border-radius: 18px 18px 0 0;
    color: var(--ink);
  }

  .arena-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 8px;
  }

  .back-btn {
    border: 0;
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #ffffff;
    background: #111827;
    box-shadow: 0 3px 0 #000000;
  }

  .back-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #000000;
  }

  .arena-title {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.14em;
    color: #374151;
  }

  .arena-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 4px 12px calc(18px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .term-card {
    flex: none;
    background: #ffffff;
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 8px 0 -3px #b8bec7, 0 16px 26px rgba(17, 24, 39, 0.14);
  }

  .term-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .term-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 900;
    color: var(--ink);
  }

  .token-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 900;
    color: #ffffff;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25);
  }

  .term-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .state-badge {
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.1em;
    background: #eef1f5;
    color: #4b5563;
  }

  .state-badge[data-state="running"] { background: #e7f9ef; color: #0f8a4f; }
  .state-badge[data-state="crashed"] { background: #ffe8ec; color: #d61f45; }

  .players {
    font-size: 10px;
    font-weight: 700;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
  }

  .chart-wrap {
    position: relative;
    height: 138px;
    border-radius: 12px;
    overflow: hidden;
    background: #fafbfc;
    border: 1px solid #edf0f3;
  }

  .chart-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .mult-overlay {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 30px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #111827;
    pointer-events: none;
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
  }

  .mult-overlay[data-state="waiting"] { color: #9ca3af; }
  .mult-overlay[data-state="running"] { color: #0f8a4f; }
  .mult-overlay[data-state="crashed"] { color: #e11d48; }

  .sub-overlay {
    position: absolute;
    top: 44px;
    right: 14px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #6b7280;
    pointer-events: none;
  }

  .pill-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    padding: 9px 0 2px;
    scrollbar-width: none;
    min-height: 34px;
  }

  .pill-row::-webkit-scrollbar { display: none; }

  .pill-empty {
    font-size: 11px;
    color: #9ca3af;
    font-weight: 600;
    padding: 4px 0;
  }

  .pill {
    flex: none;
    border: 0;
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  }

  .pill:active { transform: translateY(1px); box-shadow: none; }
  .tier-red { background: #ef2b4f; }
  .tier-green { background: #12b76a; }
  .tier-pink { background: #ec4899; }
  .tier-yellow { background: #facc15; color: #3b2a00; }
  .tier-orange { background: #ff7a00; }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 44px;
    padding: 0 12px;
    border-radius: 12px;
    background: #f3f5f8;
    border: 1px solid #e2e6eb;
  }

  .field:focus-within {
    border-color: #ff9a3d;
    box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.16);
  }

  .field span {
    font-size: 12px;
    font-weight: 800;
    color: #4b5563;
    white-space: nowrap;
  }

  .field input {
    width: 55%;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    text-align: right;
    font-size: 16px;
    font-weight: 900;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .field input::placeholder { color: #9ca3af; font-weight: 700; }

  .margin-btn {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.1em;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }

  .margin-btn:active:not(:disabled) { transform: translateY(3px); }

  .margin-btn.is-idle {
    color: #2a1100;
    background: linear-gradient(180deg, #ffc23d 0%, #ff8a00 100%);
    box-shadow: 0 4px 0 #b44700, 0 8px 16px rgba(255, 122, 0, 0.25);
  }

  .margin-btn.is-queued {
    color: #1f2937;
    background: #e5e9f0;
    box-shadow: 0 4px 0 #b9c0cb;
  }

  .margin-btn.is-busy,
  .margin-btn.is-open {
    color: #7c4a00;
    background: #fff4dc;
    box-shadow: inset 0 0 0 2px #ffc35c;
  }

  .margin-btn.is-cashout {
    color: #ffffff;
    background: linear-gradient(180deg, #4b9bff 0%, #1f7bff 55%, #0d5fe0 100%);
    box-shadow: 0 4px 0 #083f9c, 0 8px 18px rgba(31, 123, 255, 0.4);
    animation: cashPulse 1s ease-in-out infinite;
  }

  .margin-btn.is-cashed {
    color: #ffffff;
    background: linear-gradient(180deg, #2fe08d, #0fae62);
    box-shadow: 0 4px 0 #087a43;
  }

  .margin-btn.is-lost {
    color: #ffffff;
    background: linear-gradient(180deg, #ff5f7a, #e11d48);
    box-shadow: 0 4px 0 #9b0f2f;
  }

  @keyframes cashPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.15); }
  }

  .bag-float {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 22px;
    font-weight: 900;
    animation: bagUp 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }

  .bag-float small {
    font-size: 12px;
    color: #19d27a;
    text-shadow: 0 1px 0 #03150b;
  }

  @keyframes bagUp {
    0% { transform: translate(0, -50%) scale(0.4); opacity: 0; }
    18% { transform: translate(4px, -90%) scale(1.25); opacity: 1; }

    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-head {
    flex: none;
    display: flex;
    align-items: center;

  .verdict {
    display: flex;

  .verdict.bad { background: #ffe8ec; color: #d61f45; }

  .steps {
    margin: 0;

    flex-direction: column;

  .steps li {
    position: relative;
    padding: 9px 10px 9px 38px;
    border-radius: 12px;

  .steps li::before {
    counter-increment: step;

    position: absolute;
    left: 9px;

    align-items: center;

  .steps code {

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));

    max-width: calc(100% - 32px);
    transform: translate(-50%, 20px);

    padding: 10px 14px;

  .sr-only {

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
(() => {
  'use strict';

  const ROOM_META = [
    { id: 'TON', name: 'TON Engine', symbol: 'T', color: '#0098ea' },
    { id: 'NOT', name: 'NOT Canvas', symbol: 'N', color: '#1a1a1a' },
    { id: 'XCOIN', name: 'X-Coin Arena', symbol: 'X', color: '#e5a000' },
  ];
  const CHART_WINDOW_MS = 12000;
  const MAX_TAP_IN_FLIGHT = 3;
  const PILL_LIMIT = 16;
  const DEMO_START_BONUS = 5;
  const TAP_FLOATER_TEXT = '\u{1F4B0} +$0.01';

  let config = {
    maxMultiplier: 35,
    growthRate: 0.00012,
    waitingMs: 6000,
    crashedMs: 3000,
    tickMs: 100,
    dailyTapLimit: 300,
    tapsPerReward: 10,
    tapReward: 0.1,
    instantBustModulus: 33,
    minMargin: 0.1,
    maxMargin: 1000,
    walletEnabled: true,
    depositUrl: '',
    withdrawUrl: '',
  };

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const $ = (selector, root) => (root || document).querySelector(selector);

  const els = {
    netChip: $('#netChip'),
    deposit: $('#depositBalance'),
    bonus: $('#bonusBalance'),
    depositLink: $('#depositLink'),
    withdrawLink: $('#withdrawLink'),
    mineCount: $('#mineCount'),
    mineFill: $('#mineFill'),
    mineMeter: $('#mineMeter'),
    taskCount: $('#taskCount'),
    taskFill: $('#taskFill'),
    taskMeter: $('#taskMeter'),
    coinStage: $('#coinStage'),
    coin: $('#tapCoin'),
    coinHint: $('#coinHint'),
    floaters: $('#floaterLayer'),
    launch: $('#launchBtn'),
    back: $('#backBtn'),
    track: $('#track'),
    pageMine: $('#pageMine'),
    pageArena: $('#pageArena'),
    arena: $('#arenaScroll'),
    modal: $('#modal'),
    modalTitle: $('#modalTitle'),
    modalBody: $('#modalBody'),
    modalClose: $('#modalClose'),
    toast: $('#toast'),
    cardTemplate: $('#cardTemplate'),
  };

  const enc = new TextEncoder();
  const hasSubtle = Boolean(window.crypto && window.crypto.subtle && window.isSecureContext !== false);

  function randomHex(bytes) {
    const buffer = new Uint8Array(bytes);
    window.crypto.getRandomValues(buffer);
    return Array.from(buffer, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  function toHex(buffer) {
    return Array.from(new Uint8Array(buffer), (b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function sha256Hex(text) {
    return toHex(await window.crypto.subtle.digest('SHA-256', enc.encode(text)));
  }

  async function hmacHex(key, message) {
    const cryptoKey = await window.crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return toHex(await window.crypto.subtle.sign('HMAC', cryptoKey, enc.encode(message)));
  }

  function crashFromHash(hashHex) {
    const slice = hashHex.slice(0, 13);
    const h = parseInt(slice, 16);
    const e = 2 ** 52;
    const modulo = h % config.instantBustModulus;
    if (modulo === 0) return { slice, h, e, modulo, instant: true, raw: 1, result: 1 };
    const raw = Math.floor((100 * e - h) / (e - h)) / 100;
    return { slice, h, e, modulo, instant: false, raw, result: Math.min(Math.max(raw, 1), config.maxMultiplier) };
  }

  function multiplierAt(elapsedMs) {
    return Math.floor(Math.exp(config.growthRate * Math.max(0, elapsedMs)) * 100) / 100;
  }

  function tierOf(multiplier) {
    if (multiplier >= 35) return 'orange';
    if (multiplier >= 10) return 'yellow';
    if (multiplier >= 5) return 'pink';
    if (multiplier >= 2) return 'green';
    return 'red';
  }

  function money(value) {
    return '$' + (Number(value) || 0).toFixed(2);
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function round2(value) {
    return Math.round(value * 100) / 100;
  }

  function haptic(kind) {
    if (!tg || !tg.HapticFeedback) return;
    try {
      if (kind === 'light' || kind === 'medium' || kind === 'heavy') tg.HapticFeedback.impactOccurred(kind);
      else tg.HapticFeedback.notificationOccurred(kind);
    } catch (err) {
      return;
    }
  }

  let toastTimer = 0;
  function toast(message) {
    els.toast.textContent = message;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
  }

  function setNet(mode) {
    const labels = { connecting: 'CONNECTING', live: 'LIVE', demo: 'DEMO', reconnecting: 'RECONNECTING' };
    els.netChip.dataset.mode = mode;
    els.netChip.textContent = labels[mode] || mode.toUpperCase();
  }

  function setupTelegram() {
    if (!tg) return;
    try {
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
      if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#0a0e17');
      if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#0a0e17');
      if (typeof tg.onEvent === 'function') tg.onEvent('viewportChanged', syncViewport);
      if (tg.BackButton && typeof tg.BackButton.onClick === 'function') tg.BackButton.onClick(() => showArena(false));
    } catch (err) {
      return;
    }
  }

  function syncViewport() {
    const tgHeight = tg && tg.viewportStableHeight ? tg.viewportStableHeight : 0;
    const height = tgHeight > 200 ? tgHeight : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', height + 'px');
  }

  function resolveUserId() {
    const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
    if (tgUser && tgUser.id) return String(tgUser.id);
    let id = null;
    try {
      id = window.localStorage.getItem('cx_guest_id');
    } catch (err) {
      id = null;
    }
    if (!id || !/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
      id = 'guest_' + randomHex(8);
      try {
        window.localStorage.setItem('cx_guest_id', id);
      } catch (err) {
        return id;
      }
    }
    return id;
  }

  const userId = resolveUserId();
  const initData = tg && tg.initData ? tg.initData : '';

  const wallet = { deposit: 0, bonus: 0 };
  const taps = { confirmed: 0, inFlight: 0, queued: 0 };
  let requestSeq = 0;
  let appliedSeq = 0;

  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 180);
  }

  function applyWallet(data, seq) {
    if (!data) return;
    if (typeof seq === 'number') {
      if (seq < appliedSeq) return;
      appliedSeq = seq;
    }
    const nextDeposit = Number(data.deposit_balance) || 0;
    const nextBonus = Number(data.bonus_balance) || 0;
    if (nextDeposit !== wallet.deposit) {
      wallet.deposit = nextDeposit;
      els.deposit.textContent = money(nextDeposit);
      bump(els.deposit);
    }
    if (nextBonus !== wallet.bonus) {
      wallet.bonus = nextBonus;
      els.bonus.textContent = money(nextBonus);
      bump(els.bonus);
    }
  }

  function apiError(message, status, code, body) {
    const err = new Error(message);
    err.status = status;
    err.code = code;
    err.body = body || {};
    return err;
  }

  async function request(method, routePath, params) {
    const query = new URLSearchParams(Object.assign({ user_id: userId }, params || {}));
    let response;
    try {
      response = await fetch(routePath + '?' + query.toString(), {
        method,
        headers: { 'X-Telegram-Init-Data': initData },
        cache: 'no-store',
        credentials: 'same-origin',
      });
    } catch (err) {
      throw apiError('Network error - check your connection', 0, 'NETWORK');
    }
    let body = {};
    try {
      body = await response.json();
    } catch (err) {
      body = {};
    }
    if (!response.ok || body.ok === false) {
      throw apiError(body.error || 'Request failed (' + response.status + ')', response.status, body.code, body);
    }
    return body;
  }

  const demo = {
    active: false,
    wallet: { deposit_balance: 0, bonus_balance: DEMO_START_BONUS, daily_taps: 0 },
    rooms: new Map(),
    timer: 0,
  };

  const api = {
    wallet() {
      return demo.active ? demoApi.wallet() : request('GET', '/wallet');
    },
    tap() {
      return demo.active ? demoApi.tap() : request('POST', '/credit-tap');
    },
    openMargin(roomId, amount) {
      return demo.active ? demoApi.openMargin(roomId, amount) : request('POST', '/open-margin', { room: roomId, amount: amount.toFixed(2) });
    },
    cashOut(roomId) {
      return demo.active ? demoApi.cashOut(roomId) : request('POST', '/cash-out', { room: roomId });
    },
  };

  function walletSnapshot() {
    return {
      deposit_balance: round2(demo.wallet.deposit_balance),
      bonus_balance: round2(demo.wallet.bonus_balance),
      daily_taps: demo.wallet.daily_taps,
    };
  }

  function delay(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  const demoApi = {
    async wallet() {
      await delay(20);
      const bets = {};
      for (const room of demo.rooms.values()) {
        if (room.bet) {
          bets[room.id] = {
            roundId: room.nonce,
            amount: room.bet.amount,
            source: room.bet.source,
            confirmed: true,
            cashedOut: room.bet.cashedOut,
            cashoutMultiplier: room.bet.cashoutMultiplier,
            payout: room.bet.payout,
          };
        }
      }
      return { ok: true, wallet: walletSnapshot(), bets };
    },
    async tap() {
      await delay(35);
      const w = demo.wallet;
      if (w.daily_taps >= config.dailyTapLimit) {
        return { ok: true, wallet: walletSnapshot(), credited: false, limit_reached: true };
      }
      w.daily_taps += 1;
      let credited = false;
      if (w.daily_taps % config.tapsPerReward === 0) {
        w.bonus_balance = round2(w.bonus_balance + config.tapReward);
        credited = true;
      }
      return { ok: true, wallet: walletSnapshot(), credited, limit_reached: w.daily_taps >= config.dailyTapLimit };
    },
    async openMargin(roomId, amount) {
      await delay(40);
      const room = demo.rooms.get(roomId);
      if (!room) throw apiError('Unknown trading room', 400);
      if (room.state !== 'waiting') throw apiError('Round already in flight - wait for the next takeoff', 409, 'ROUND_LOCKED');
      if (room.bet) throw apiError('You already have an open margin in this round', 409, 'ALREADY_OPEN');
      const w = demo.wallet;
      let source;
      if (w.deposit_balance >= amount) {
        w.deposit_balance = round2(w.deposit_balance - amount);
        source = 'deposit';
      } else if (w.bonus_balance >= amount) {
        w.bonus_balance = round2(w.bonus_balance - amount);
        source = 'bonus';
      } else {
        throw apiError('Insufficient balance', 402, 'INSUFFICIENT_FUNDS');
      }
      room.bet = { amount, source, cashedOut: false, cashoutMultiplier: null, payout: 0 };
      return { ok: true, room: roomId, roundId: room.nonce, amount, source, wallet: walletSnapshot() };
    },
    async cashOut(roomId) {
      const room = demo.rooms.get(roomId);
      if (!room) throw apiError('Unknown trading room', 400);
      const bet = room.bet;
      if (!bet) throw apiError('No open margin in this round', 404, 'NO_MARGIN');
      if (bet.cashedOut) throw apiError('Already cashed out', 409, 'ALREADY_CASHED');
      if (room.state !== 'running') throw apiError('Crashed before cash out', 409, 'CRASHED');
      const multiplier = multiplierAt(Date.now() - room.phaseStartedAt);
      if (multiplier >= room.crashPoint) throw apiError('Crashed before cash out', 409, 'CRASHED');
      bet.cashedOut = true;
      bet.cashoutMultiplier = multiplier;
      bet.payout = round2(bet.amount * multiplier);
      if (bet.source === 'deposit') demo.wallet.deposit_balance = round2(demo.wallet.deposit_balance + bet.payout);
      else demo.wallet.bonus_balance = round2(demo.wallet.bonus_balance + bet.payout);
      await delay(30);
      return { ok: true, room: roomId, roundId: room.nonce, multiplier, payout: bet.payout, source: bet.source, wallet: walletSnapshot() };
    },
  };

  async function demoPrepare(room) {
    const nonce = room.nonce + 1;
    const serverSeed = randomHex(32);
    if (hasSubtle) {
      const [serverSeedHash, hash] = await Promise.all([sha256Hex(serverSeed), hmacHex(serverSeed, room.clientSeed + ':' + nonce)]);
      room.next = { serverSeed, serverSeedHash, hash };
    } else {
      room.next = { serverSeed, serverSeedHash: '', hash: randomHex(32) };
    }
  }

  function demoStartRound(room, now) {
    const next = room.next;
    room.next = null;
    room.nonce += 1;
    room.serverSeed = next.serverSeed;
    room.serverSeedHash = next.serverSeedHash;
    room.roundHash = next.hash;
    room.crashPoint = crashFromHash(next.hash).result;
    room.state = 'waiting';
    room.phaseStartedAt = now;
    room.multiplier = 1;
    room.bet = null;
    demoPrepare(room);
  }

  function demoCrash(room, now) {
    room.state = 'crashed';
    room.multiplier = room.crashPoint;
    room.phaseStartedAt = now;
    room.history.unshift({
      room: room.id,
      roundId: room.nonce,
      nonce: room.nonce,
      crashPoint: room.crashPoint,
      serverSeed: room.serverSeed,
      serverSeedHash: room.serverSeedHash,
      clientSeed: room.clientSeed,
      hash: room.roundHash,
      endedAt: now,
    });
    if (room.history.length > 24) room.history.length = 24;
    handleHistory({ room: room.id, history: room.history });
  }

  function demoAdvance(room, now) {
    const elapsed = now - room.phaseStartedAt;
    if (room.state === 'waiting') {
      if (elapsed >= config.waitingMs) {
        room.state = 'running';
        room.phaseStartedAt = now;
        room.multiplier = 1;
      }
      return;
    }
    if (room.state === 'running') {
      const current = multiplierAt(elapsed);
      if (current >= room.crashPoint) demoCrash(room, now);
      else room.multiplier = current;
      return;
    }
    if (room.state === 'crashed' && elapsed >= config.crashedMs && room.next) {
      demoStartRound(room, now);
    }
  }

  function demoFrame(room, now) {
    const elapsed = now - room.phaseStartedAt;
    return {
      id: room.id,
      state: room.state,
      multiplier: room.multiplier,
      crashPoint: room.state === 'crashed' ? room.crashPoint : null,
      roundId: room.nonce,
      serverSeedHash: room.serverSeedHash,
      clientSeed: room.clientSeed,
      elapsed,
      countdown: room.state === 'waiting' ? Math.max(0, config.waitingMs - elapsed) : 0,
      players: room.bet ? 1 : 0,
    };
  }

  function demoTick() {
    const now = Date.now();
    for (const room of demo.rooms.values()) demoAdvance(room, now);
    handleTick({ t: now, rooms: Array.from(demo.rooms.values(), (room) => demoFrame(room, now)) });
  }

  async function enterDemo() {
    if (demo.active) return;
    demo.active = true;
    closeTicker();
    setNet('demo');
    config.walletEnabled = true;
    await Promise.all(ROOM_META.map(async (meta) => {
      const room = {
        id: meta.id,
        clientSeed: randomHex(16),
        nonce: 0,
        state: 'waiting',
        phaseStartedAt: 0,
        serverSeed: '',
        serverSeedHash: '',
        roundHash: '',
        crashPoint: 1,
        multiplier: 1,
        history: [],
        bet: null,
        next: null,
      };
      demo.rooms.set(meta.id, room);
      await demoPrepare(room);
    }));
    const now = Date.now();
    ROOM_META.forEach((meta, index) => demoStartRound(demo.rooms.get(meta.id), now - index * 2000));
    handleHello({
      config: {},
      rooms: Array.from(demo.rooms.values(), (room) => demoFrame(room, now)),
      histories: {},
    });
    demo.timer = setInterval(demoTick, config.tickMs);
    hydrateWallet();
    toast('Demo mode - practice balance credited');
  }

  let eventSource = null;
  let everOpened = false;
  let lastTickAt = 0;
  let fallbackTimer = 0;

  function closeTicker() {
    clearTimeout(fallbackTimer);
    if (eventSource) {
      eventSource.close();
      eventSource = null;
    }
  }

  function connectTicker() {
    closeTicker();
    if (demo.active) return;
    if (typeof window.EventSource !== 'function' || !/^https?:$/.test(window.location.protocol)) {
      enterDemo();
      return;
    }
    let source;
    try {
      source = new EventSource('/live-ticker');
    } catch (err) {
      enterDemo();
      return;
    }
    eventSource = source;
    if (!everOpened) {
      fallbackTimer = setTimeout(() => {
        if (!everOpened) enterDemo();
      }, 4500);
    }
    source.addEventListener('open', () => {
      clearTimeout(fallbackTimer);
      const firstOpen = !everOpened;
      everOpened = true;
      lastTickAt = Date.now();
      setNet('live');
      if (firstOpen) hydrateWallet();
    });
    source.addEventListener('hello', (event) => {
      lastTickAt = Date.now();
      handleHello(JSON.parse(event.data));
    });
    source.addEventListener('tick', (event) => {
      lastTickAt = Date.now();
      handleTick(JSON.parse(event.data));
    });
    source.addEventListener('history', (event) => {
      handleHistory(JSON.parse(event.data));
    });
    source.addEventListener('error', () => {
      if (!everOpened) {
        enterDemo();
        return;
      }
      setNet('reconnecting');
    });
  }

  setInterval(() => {
    if (demo.active || !everOpened || document.hidden) return;
    if (Date.now() - lastTickAt > 6000) {
      setNet('reconnecting');
      connectTicker();
    }
  }, 2500);

  const rooms = {};
  const roomList = [];

  function buildCards() {
    for (const meta of ROOM_META) {
      const fragment = els.cardTemplate.content.cloneNode(true);
      const card = fragment.querySelector('.term-card');
      card.dataset.room = meta.id;
      const cardEls = {};
      card.querySelectorAll('[data-el]').forEach((node) => {
        cardEls[node.dataset.el] = node;
      });
      cardEls.name.textContent = meta.name;
      cardEls.dot.textContent = meta.symbol;
      cardEls.dot.style.background = meta.color;
      card.setAttribute('aria-label', meta.name + ' terminal');
      els.arena.appendChild(fragment);

      const rs = {
        meta,
        els: cardEls,
        ctx: cardEls.canvas.getContext('2d'),
        dpr: 1,
        cssW: 0,
        cssH: 0,
        yMax: 2,
        points: [],
        live: null,
        history: [],
        bet: null,
        queued: null,
        renderKey: '',
      };
      cardEls.action.addEventListener('click', () => onAction(rs));
      cardEls.pills.addEventListener('click', (event) => {
        const pill = event.target.closest('.pill');
        if (!pill) return;
        const index = Number(pill.dataset.index);
        const record = rs.history[index];
        if (record) verifyRound(record, rs.history[index + 1] || null);
      });
      rooms[meta.id] = rs;
      roomList.push(rs);
      renderPills(rs);
    }

    if (typeof window.ResizeObserver === 'function') {
      const observer = new ResizeObserver((entries) => {
        for (const entry of entries) {
          const rs = roomList.find((item) => item.els.canvas === entry.target);
          if (rs) sizeCanvas(rs, entry.contentRect.width, entry.contentRect.height);
        }
      });
      roomList.forEach((rs) => observer.observe(rs.els.canvas));
    } else {
      window.addEventListener('resize', () => roomList.forEach((rs) => sizeCanvas(rs)));
    }
    roomList.forEach((rs) => sizeCanvas(rs));
  }

  function sizeCanvas(rs, width, height) {
    const rect = rs.els.canvas.getBoundingClientRect();
    const w = width || rect.width;
    const h = height || rect.height;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    rs.dpr = dpr;
    rs.cssW = w;
    rs.cssH = h;
    rs.els.canvas.width = Math.round(w * dpr);
    rs.els.canvas.height = Math.round(h * dpr);
  }

  function handleHello(data) {
    if (data.config) config = Object.assign({}, config, data.config);
    if (!demo.active && config.walletEnabled === false) toast('Wallet service offline');
    const now = performance.now();
    (data.rooms || []).forEach((frame) => updateRoom(frame, now));
    const histories = data.histories || {};
    Object.keys(histories).forEach((id) => {
      if (rooms[id]) {
        rooms[id].history = histories[id] || [];
        renderPills(rooms[id]);
      }
    });
  }

  function handleTick(data) {
    const now = performance.now();
    (data.rooms || []).forEach((frame) => updateRoom(frame, now));
  }

  function handleHistory(data) {
    const rs = rooms[data.room];
    if (!rs) return;
    rs.history = data.history || [];
    renderPills(rs);
  }

  function updateRoom(frame, now) {
    const rs = rooms[frame.id];
    if (!rs) return;
    rs.live = frame;

    const value = frame.state === 'crashed' && frame.crashPoint ? frame.crashPoint : frame.multiplier;
    rs.points.push({ t: now, m: value, s: frame.state });
    const cutoff = now - CHART_WINDOW_MS - 1000;
    while (rs.points.length > 2 && rs.points[1].t < cutoff) rs.points.shift();

    const bet = rs.bet;
    if (bet && bet.status === 'open') {
      if (frame.roundId !== bet.roundId) {
        rs.bet = null;
      } else if (frame.state === 'crashed') {
        bet.status = 'lost';
        bet.crash = frame.crashPoint;
        haptic('error');
      }
    }
    if (rs.bet && rs.bet.status === 'lost' && !rs.bet.crash && frame.state === 'crashed' && frame.roundId === rs.bet.roundId) {
      rs.bet.crash = frame.crashPoint;
    }
    if (rs.bet && (rs.bet.status === 'cashed' || rs.bet.status === 'lost') && frame.roundId !== rs.bet.roundId) {
      rs.bet = null;
    }

    if (!rs.bet && rs.queued && frame.state === 'waiting' && frame.countdown > 400) {
      const queued = rs.queued;
      rs.queued = null;
      placeBet(rs, queued.amount, queued.auto);
    }

    if (rs.bet && rs.bet.status === 'open' && rs.bet.auto && frame.state === 'running' && frame.roundId === rs.bet.roundId && frame.multiplier >= rs.bet.auto) {
      cashOut(rs);
    }

    renderRoom(rs);
  }

  function renderRoom(rs) {
    const frame = rs.live;
    if (!frame) return;
    const e = rs.els;
    let multText;
    let subText;
    if (frame.state === 'waiting') {
      multText = '1.00x';
      subText = 'TAKEOFF IN ' + (frame.countdown / 1000).toFixed(1) + 'S';
    } else if (frame.state === 'running') {
      multText = frame.multiplier.toFixed(2) + 'x';
      subText = 'IN FLIGHT \u00B7 ROUND #' + frame.roundId;
    } else {
      multText = (frame.crashPoint || frame.multiplier).toFixed(2) + 'x';
      subText = 'CRASHED \u00B7 ROUND #' + frame.roundId;
    }
    if (e.mult.textContent !== multText) e.mult.textContent = multText;
    if (e.mult.dataset.state !== frame.state) e.mult.dataset.state = frame.state;
    if (e.sub.textContent !== subText) e.sub.textContent = subText;
    if (e.state.dataset.state !== frame.state) {
      e.state.dataset.state = frame.state;
      e.state.textContent = frame.state === 'running' ? 'LIVE' : frame.state.toUpperCase();
    }
    const playersText = frame.players + ' open';
    if (e.players.textContent !== playersText) e.players.textContent = playersText;
    renderAction(rs);
  }

  function renderAction(rs) {
    const frame = rs.live;
    const bet = rs.bet;
    let label = 'OPEN MARGIN';
    let cls = 'is-idle';
    let disabled = false;

    if (bet) {
      if (bet.status === 'placing') {
        label = 'OPENING MARGIN\u2026';
        cls = 'is-busy';
        disabled = true;
      } else if (bet.status === 'open') {
        if (frame && frame.state === 'running' && frame.roundId === bet.roundId) {
          label = 'CASH OUT  ' + money(bet.amount * frame.multiplier);
          cls = 'is-cashout';
        } else {
          label = 'MARGIN OPEN \u00B7 ' + money(bet.amount) + (bet.auto ? ' \u00B7 AUTO ' + bet.auto.toFixed(2) + 'x' : '');
          cls = 'is-open';
          disabled = true;
        }
      } else if (bet.status === 'cashing') {
        label = 'CASHING OUT\u2026';
        cls = 'is-cashout';
        disabled = true;
      } else if (bet.status === 'cashed') {
        label = 'CASHED @ ' + bet.multiplier.toFixed(2) + 'x \u00B7 +' + money(bet.payout);
        cls = 'is-cashed';
        disabled = true;
      } else if (bet.status === 'lost') {
        label = bet.crash ? 'LIQUIDATED @ ' + bet.crash.toFixed(2) + 'x' : 'LIQUIDATED';
        cls = 'is-lost';
        disabled = true;
      }
    } else if (rs.queued) {
      label = 'QUEUED ' + money(rs.queued.amount) + ' \u00B7 TAP TO CANCEL';
      cls = 'is-queued';
    }

    const key = label + '|' + cls + '|' + disabled;
    if (key === rs.renderKey) return;
    rs.renderKey = key;
    const button = rs.els.action;
    button.textContent = label;
    button.className = 'margin-btn ' + cls;
    button.disabled = disabled;
  }

  function parseAmount(raw) {
    const value = round2(Number(raw));
    if (!Number.isFinite(value) || value < config.minMargin || value > config.maxMargin) return null;
    return value;
  }

  function parseAuto(raw) {
    if (raw === '' || raw === null || raw === undefined) return null;
    const value = round2(Number(raw));
    if (!Number.isFinite(value) || value < 1.01 || value > config.maxMultiplier) return null;
    return value;
  }

  function onAction(rs) {
    const frame = rs.live;
    const bet = rs.bet;
    if (bet && bet.status === 'open' && frame && frame.state === 'running' && frame.roundId === bet.roundId) {
      cashOut(rs);
      return;
    }
    if (bet) return;
    if (rs.queued) {
      rs.queued = null;
      renderAction(rs);
      return;
    }
    const amount = parseAmount(rs.els.amount.value);
    if (amount === null) {
      toast('Enter a margin between ' + money(config.minMargin) + ' and ' + money(config.maxMargin));
      return;
    }
    const autoRaw = rs.els.auto.value.trim();
    const auto = parseAuto(autoRaw);
    if (autoRaw !== '' && auto === null) {
      toast('Auto cash-out must be between 1.01x and ' + config.maxMultiplier + 'x');
      return;
    }
    if (amount > Math.max(wallet.deposit, wallet.bonus)) {
      toast('Insufficient balance - tap the coin to mine bonus credit');
      return;
    }
    if (frame && frame.state === 'waiting' && frame.countdown > 300) {
      placeBet(rs, amount, auto);
    } else {
      rs.queued = { amount, auto };
      renderAction(rs);
      haptic('light');
    }
  }

  async function placeBet(rs, amount, auto) {
    const roundId = rs.live ? rs.live.roundId : 0;
    const bet = { status: 'placing', amount, auto, roundId, crash: null, multiplier: 0, payout: 0 };
    rs.bet = bet;
    renderAction(rs);
    const seq = ++requestSeq;
    try {
      const res = await api.openMargin(rs.meta.id, amount);
      applyWallet(res.wallet, seq);
      if (rs.bet === bet) {
        bet.status = 'open';
        bet.roundId = res.roundId;
        bet.source = res.source;
      }
      haptic('medium');
    } catch (err) {
      if (err.body && err.body.wallet) applyWallet(err.body.wallet, seq);
      if (rs.bet === bet) rs.bet = null;
      toast(err.message);
      haptic('error');
    }
    renderAction(rs);
  }

  async function cashOut(rs) {
    const bet = rs.bet;
    if (!bet || bet.status !== 'open') return;
    bet.status = 'cashing';
    renderAction(rs);
    const seq = ++requestSeq;
    try {
      const res = await api.cashOut(rs.meta.id);
      applyWallet(res.wallet, seq);
      bet.status = 'cashed';
      bet.multiplier = res.multiplier;
      bet.payout = res.payout;
      throwBag(res.payout);
      haptic('success');
    } catch (err) {
      if (err.code === 'CRASHED') {
        bet.status = 'lost';
        bet.crash = rs.live && rs.live.state === 'crashed' ? rs.live.crashPoint : null;
        haptic('error');
      } else if (err.code === 'ALREADY_CASHED') {
        bet.status = 'cashed';
      } else {
        bet.status = 'open';
      }
      toast(err.message);
    }
    renderAction(rs);
  }

  function restoreBets(bets) {
    Object.keys(bets || {}).forEach((id) => {
      const rs = rooms[id];
      const b = bets[id];
      if (!rs || !b || !b.confirmed) return;
      if (b.cashedOut) {
        rs.bet = { status: 'cashed', amount: b.amount, roundId: b.roundId, multiplier: b.cashoutMultiplier || 1, payout: b.payout || 0, auto: null, crash: null };
      } else {
        rs.bet = { status: 'open', amount: b.amount, roundId: b.roundId, multiplier: 0, payout: 0, auto: null, crash: null, source: b.source };
      }
      renderAction(rs);
    });
  }

  async function hydrateWallet() {
    const seq = ++requestSeq;
    try {
      const res = await api.wallet();
      applyWallet(res.wallet, seq);
      taps.confirmed = Number(res.wallet.daily_taps) || 0;
      renderTaps();
      restoreBets(res.bets);
    } catch (err) {
      toast(err.status === 503 ? 'Wallet service offline' : err.message);
    }
  }

  function totalTaps() {
    return Math.min(config.dailyTapLimit, taps.confirmed + taps.inFlight + taps.queued);
  }

  function renderTaps() {
    const total = totalTaps();
    const limit = config.dailyTapLimit;
    const perBundle = config.tapsPerReward;
    const limitReached = total >= limit;
    const bundle = limitReached ? perBundle : total % perBundle;

    els.mineCount.textContent = total + '/' + limit;
    els.mineFill.style.width = (total / limit) * 100 + '%';
    els.mineMeter.setAttribute('aria-valuenow', String(total));
    els.mineMeter.setAttribute('aria-valuemax', String(limit));

    els.taskCount.textContent = bundle + '/' + perBundle;
    els.taskFill.style.width = (bundle / perBundle) * 100 + '%';
    els.taskMeter.setAttribute('aria-valuenow', String(bundle));
    els.taskMeter.setAttribute('aria-valuemax', String(perBundle));

    els.coin.classList.toggle('is-locked', limitReached);
    els.coinHint.textContent = limitReached
      ? 'Daily mining limit reached - come back tomorrow'
      : 'Every ' + perBundle + ' taps credits +' + money(config.tapReward) + ' bonus';
  }

  function spawnFloater(x, y, text, variant) {
    const node = document.createElement('span');
    node.className = 'floater' + (variant ? ' ' + variant : '');
    node.textContent = text;
    node.style.left = x + 'px';
    node.style.top = y + 'px';
    node.style.setProperty('--dx', Math.round((Math.random() - 0.5) * 70) + 'px');
    node.addEventListener('animationend', () => node.remove());
    els.floaters.appendChild(node);
    if (els.floaters.childElementCount > 40) els.floaters.firstElementChild.remove();
  }

  const COIN_BASE = 'rotateX(30deg) rotateZ(-10deg)';
  function springCoin() {
    if (typeof els.coin.animate !== 'function') return;
    els.coin.animate([
      { transform: COIN_BASE + ' translateY(0px) scale(1)' },
      { transform: COIN_BASE + ' translateY(8px) scale(0.9)', offset: 0.22 },
      { transform: COIN_BASE + ' translateY(-5px) scale(1.06)', offset: 0.55 },
      { transform: COIN_BASE + ' translateY(1px) scale(0.98)', offset: 0.8 },
      { transform: COIN_BASE + ' translateY(0px) scale(1)' },
    ], { duration: 420, easing: 'ease-out' });
  }

  function stagePoint(clientX, clientY) {
    const rect = els.coinStage.getBoundingClientRect();
    if (typeof clientX !== 'number' || (clientX === 0 && clientY === 0)) {
      const coinRect = els.coin.getBoundingClientRect();
      return { x: coinRect.left + coinRect.width / 2 - rect.left, y: coinRect.top + coinRect.height / 3 - rect.top };
    }
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function registerTap(clientX, clientY) {
    const point = stagePoint(clientX, clientY);
    if (totalTaps() >= config.dailyTapLimit) {
      spawnFloater(point.x, point.y, 'Daily limit reached', 'limit');
      haptic('warning');
      return;
    }
    taps.queued += 1;
    renderTaps();
    springCoin();
    spawnFloater(point.x, point.y, TAP_FLOATER_TEXT);
    haptic('light');
    pumpTaps();
  }

  function pumpTaps() {
    while (taps.queued > 0 && taps.inFlight < MAX_TAP_IN_FLIGHT) {
      taps.queued -= 1;
      taps.inFlight += 1;
      sendTap();
    }
  }

  async function sendTap() {
    const seq = ++requestSeq;
    try {
      const res = await api.tap();
      taps.confirmed = Math.max(taps.confirmed, Number(res.wallet.daily_taps) || 0);
      applyWallet(res.wallet, seq);
      if (res.credited) {
        const rect = els.coin.getBoundingClientRect();
        const stageRect = els.coinStage.getBoundingClientRect();
        spawnFloater(rect.left + rect.width / 2 - stageRect.left, rect.top - stageRect.top + 10, '\u{1F4B0} +' + money(config.tapReward) + ' BONUS', 'big');
        haptic('success');
      }
      if (res.limit_reached) taps.queued = 0;
    } catch (err) {
      if (err.status !== 429) toast(err.status === 503 ? 'Wallet service offline' : err.message);
    } finally {
      taps.inFlight -= 1;
      renderTaps();
      pumpTaps();
    }
  }

  function throwBag(payout) {
    const rect = els.deposit.getBoundingClientRect();
    const node = document.createElement('span');
    node.className = 'bag-float';
    node.setAttribute('aria-hidden', 'true');
    node.innerHTML = '\u{1F4B0}<small>+' + escapeHtml(money(payout)) + '</small>';
    node.style.left = Math.min(rect.right + 2, window.innerWidth - 78) + 'px';
    node.style.top = rect.top + rect.height / 2 + 'px';
    node.addEventListener('animationend', () => node.remove());
    document.body.appendChild(node);
  }

  function renderPills(rs) {
    const container = rs.els.pills;
    if (!rs.history.length) {
      container.innerHTML = '<span class="pill-empty">No completed rounds yet</span>';
      return;
    }
    const html = rs.history.slice(0, PILL_LIMIT).map((record, index) => {
      const value = Number(record.crashPoint);
      return '<button type="button" class="pill tier-' + tierOf(value) + '" data-index="' + index + '" aria-label="Round ' + record.nonce + ' crashed at ' + value.toFixed(2) + 'x - verify">' + value.toFixed(2) + 'x</button>';
    }).join('');
    container.innerHTML = html;
  }

  let lastFocus = null;

  function openModal(title, html) {
    lastFocus = document.activeElement;
    els.modalTitle.textContent = title;
    els.modalBody.innerHTML = html;
    els.modal.hidden = false;
    els.modalClose.focus();
  }

  function closeModal() {
    els.modal.hidden = true;
    els.modalBody.innerHTML = '';
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  function check(ok) {
    if (ok === null) return '<span class="check-na">&mdash; n/a</span>';
    return ok ? '<span class="check-ok">&#10003; match</span>' : '<span class="check-bad">&#10007; mismatch</span>';
  }

  async function verifyRound(record, olderRecord) {
    const title = (rooms[record.room] ? rooms[record.room].meta.name : record.room) + ' \u00B7 Round #' + record.nonce;
    openModal(title, '<p>Recomputing the SHA-256 proof in your browser&hellip;</p>');

    if (!hasSubtle) {
      els.modalBody.innerHTML =
        '<div class="verdict bad">Browser crypto unavailable</div>' +
        '<p>This browser cannot run Web Crypto in the current context. Verify manually with these revealed values:</p>' +
        '<ol class="steps">' +
        '<li><strong>Server seed</strong><code>' + escapeHtml(record.serverSeed) + '</code></li>' +
        '<li><strong>Client seed : nonce</strong><code>' + escapeHtml(record.clientSeed + ':' + record.nonce) + '</code></li>' +
        '<li><strong>HMAC-SHA256 result</strong><code>' + escapeHtml(record.hash) + '</code></li>' +
        '<li><strong>Recorded crash</strong><code>' + Number(record.crashPoint).toFixed(2) + 'x</code></li>' +
        '</ol>';
      return;
    }

    try {
      const seedHash = await sha256Hex(record.serverSeed);
      const message = record.clientSeed + ':' + record.nonce;
      const hmac = await hmacHex(record.serverSeed, message);
      const calc = crashFromHash(hmac);
      const commitOk = record.serverSeedHash ? seedHash === record.serverSeedHash : null;
      const chainOk = olderRecord && olderRecord.serverSeed ? seedHash === olderRecord.serverSeed : null;
      const hmacOk = hmac === record.hash;
      const resultOk = Math.abs(calc.result - Number(record.crashPoint)) < 0.0001;
      const allOk = hmacOk && resultOk && commitOk !== false;

      const steps = [
        '<li><strong>Revealed server seed</strong>The secret seed is published only after the round crashes.<code>' + escapeHtml(record.serverSeed) + '</code></li>',
        '<li><strong>SHA-256(server seed) vs. pre-round commitment</strong>Computed:<code>' + seedHash + '</code>Committed before takeoff:<code>' + escapeHtml(record.serverSeedHash || 'not provided') + '</code>' + check(commitOk) + '</li>',
        '<li><strong>Seed chain link</strong>SHA-256 of this seed must equal the previous round&apos;s revealed seed, proving every seed was pre-generated in one hash chain.<code>' + escapeHtml(olderRecord ? olderRecord.serverSeed : 'previous round not in history') + '</code>' + check(chainOk) + '</li>',
        '<li><strong>Message = client seed : nonce</strong><code>' + escapeHtml(message) + '</code></li>',
        '<li><strong>HMAC-SHA256(key = server seed, message)</strong><code>' + hmac + '</code>Server recorded:<code>' + escapeHtml(record.hash) + '</code>' + check(hmacOk) + '</li>',
        '<li><strong>Take the first 13 hex characters (52 bits)</strong><code>0x' + calc.slice + ' = h = ' + calc.h + '</code></li>',
        '<li><strong>Instant-bust test: h mod ' + config.instantBustModulus + '</strong><code>' + calc.h + ' mod ' + config.instantBustModulus + ' = ' + calc.modulo + '</code>' + (calc.instant ? 'Result is 0, so the round busts instantly at 1.00x.' : 'Result is not 0, so continue to the payout formula.') + '</li>',
        '<li><strong>Payout formula with e = 2^52</strong><code>e = ' + calc.e + '</code><code>raw = floor((100 &times; e &minus; h) / (e &minus; h)) / 100 = ' + calc.raw.toFixed(2) + 'x</code></li>',
        '<li><strong>Apply the ' + config.maxMultiplier + 'x growth ceiling</strong><code>min(' + calc.raw.toFixed(2) + ', ' + config.maxMultiplier + ') = ' + calc.result.toFixed(2) + 'x</code></li>',
        '<li><strong>Compare with the recorded crash</strong><code>computed ' + calc.result.toFixed(2) + 'x &nbsp;|&nbsp; recorded ' + Number(record.crashPoint).toFixed(2) + 'x</code>' + check(resultOk) + '</li>',
      ];

      els.modalBody.innerHTML =
        '<div class="verdict ' + (allOk ? 'ok' : 'bad') + '">' + (allOk ? '&#10003; PROVABLY FAIR &middot; VERIFIED' : '&#10007; VERIFICATION FAILED') + '</div>' +
        '<ol class="steps">' + steps.join('') + '</ol>';
    } catch (err) {
      els.modalBody.innerHTML = '<div class="verdict bad">Verification error</div><p>' + escapeHtml(err.message) + '</p>';
    }
  }

  function openPaymentLink(kind) {
    const url = kind === 'deposit' ? config.depositUrl : config.withdrawUrl;
    if (url) {
      if (tg && typeof tg.openLink === 'function') tg.openLink(url);
      else window.open(url, '_blank', 'noopener');
      return;
    }
    const title = kind === 'deposit' ? 'Card Deposit' : 'Card Withdrawal';
    openModal(title,
      '<p>Card ' + (kind === 'deposit' ? 'deposits' : 'withdrawals') + ' are temporarily unavailable.</p>' +
      '<p>Your X Wallet balances are shown in the panel above: <strong>True Balance</strong> ' + escapeHtml(money(wallet.deposit)) +
      ' and <strong>Bonus</strong> ' + escapeHtml(money(wallet.bonus)) + '.</p>' +
      '<p>Mine bonus credit by tapping the golden coin, then practise in the trading arena.</p>');
  }

  let arenaVisible = false;
  let rafId = 0;

  function showArena(show) {
    arenaVisible = show;
    els.track.classList.toggle('show-arena', show);
    els.pageMine.inert = show;
    els.pageArena.inert = !show;
    if (tg && tg.BackButton) {
      try {
        if (show) tg.BackButton.show();
        else tg.BackButton.hide();
      } catch (err) {
        arenaVisible = show;
      }
    }
    if (show) {
      roomList.forEach((rs) => sizeCanvas(rs));
      startDraw();
    }
  }

  function startDraw() {
    if (!rafId) rafId = requestAnimationFrame(frameLoop);
  }

  function frameLoop() {
    rafId = 0;
    if (!arenaVisible || document.hidden) return;
    const now = performance.now();
    for (const rs of roomList) drawChart(rs, now);
    rafId = requestAnimationFrame(frameLoop);
  }

  function axisLabel(value, step) {
    const decimals = step < 0.5 ? 2 : step < 1 ? 1 : 0;
    return value.toFixed(decimals) + 'x';
  }

  function tracePath(ctx, pts, a, b, xOf, yOf) {
    ctx.beginPath();
    for (let k = a; k <= b; k += 1) {
      const x = xOf(pts[k].t);
      const y = yOf(pts[k].m);
      if (k === a) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
  }

  function drawSegment(ctx, pts, a, b, state, xOf, yOf, baseY, top) {
    if (b <= a) return;
    if (state === 'running') {
      tracePath(ctx, pts, a, b, xOf, yOf);
      ctx.lineTo(xOf(pts[b].t), baseY);
      ctx.lineTo(xOf(pts[a].t), baseY);
      ctx.closePath();
      const gradient = ctx.createLinearGradient(0, top, 0, baseY);
      gradient.addColorStop(0, 'rgba(255, 122, 0, 0.32)');
      gradient.addColorStop(1, 'rgba(255, 122, 0, 0.02)');
      ctx.fillStyle = gradient;
      ctx.fill();
      tracePath(ctx, pts, a, b, xOf, yOf);
      ctx.setLineDash([]);
      ctx.lineWidth = 2.6;
      ctx.strokeStyle = '#ff6a00';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();
    } else if (state === 'crashed') {
      tracePath(ctx, pts, a, b, xOf, yOf);
      ctx.setLineDash([]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#e11d48';
      ctx.stroke();
    } else {
      tracePath(ctx, pts, a, b, xOf, yOf);
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#9ca3af';
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawChart(rs, now) {
    const ctx = rs.ctx;
    if (!ctx || !rs.cssW || !rs.cssH) return;
    const w = rs.cssW;
    const h = rs.cssH;
    ctx.setTransform(rs.dpr, 0, 0, rs.dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const padL = 38;
    const padR = 10;
    const padT = 12;
    const padB = 14;
    const cw = w - padL - padR;
    const ch = h - padT - padB;
    if (cw <= 0 || ch <= 0) return;

    const start = now - CHART_WINDOW_MS;
    const pts = rs.points;

    let peak = 1;
    for (let k = 0; k < pts.length; k += 1) {
      if (pts[k].t >= start && pts[k].m > peak) peak = pts[k].m;
    }
    const target = Math.max(2, peak * 1.2);
    rs.yMax += (target - rs.yMax) * 0.14;
    if (Math.abs(target - rs.yMax) < 0.002) rs.yMax = target;
    const yMax = Math.max(1.05, rs.yMax);

    const xOf = (t) => padL + ((t - start) / CHART_WINDOW_MS) * cw;
    const yOf = (m) => padT + ch - ((Math.min(m, yMax) - 1) / (yMax - 1)) * ch;
    const baseY = padT + ch;

    const span = yMax - 1;
    const step = [0.25, 0.5, 1, 2, 5, 10].find((s) => span / s <= 4) || 10;
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.font = '700 10px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let v = 1; v <= yMax + 1e-6; v += step) {
      const y = Math.round(yOf(v)) + 0.5;
      ctx.strokeStyle = v === 1 ? '#cfd5dc' : '#eceff3';
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(w - padR, y);
      ctx.stroke();
      ctx.fillStyle = '#9aa3af';
      ctx.fillText(axisLabel(v, step), padL - 6, y);
    }

    const vStep = 2000;
    ctx.strokeStyle = '#eef1f4';
    for (let t = Math.ceil(start / vStep) * vStep; t <= now; t += vStep) {
      const x = Math.round(xOf(t)) + 0.5;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, baseY);
      ctx.stroke();
    }

    ctx.strokeStyle = '#cfd5dc';
    ctx.beginPath();
    ctx.moveTo(padL + 0.5, padT);
    ctx.lineTo(padL + 0.5, baseY);
    ctx.stroke();

    if (pts.length < 2) return;

    ctx.save();
    ctx.beginPath();
    ctx.rect(padL + 1, padT - 4, cw + padR - 1, ch + 6);
    ctx.clip();

    let i = 0;
    while (i < pts.length - 1 && pts[i + 1].t < start) i += 1;
    while (i < pts.length) {
      const state = pts[i].s;
      let j = i;
      while (j + 1 < pts.length && pts[j + 1].s === state) j += 1;
      drawSegment(ctx, pts, i, j, state, xOf, yOf, baseY, padT);
      i = j + 1;
    }

    const last = pts[pts.length - 1];
    const lx = xOf(last.t);
    const ly = yOf(last.m);
    if (last.s === 'running') {
      ctx.fillStyle = 'rgba(255, 106, 0, 0.22)';
      ctx.beginPath();
      ctx.arc(lx, ly, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6a00';
      ctx.beginPath();
      ctx.arc(lx, ly, 4.2, 0, Math.PI * 2);
      ctx.fill();
    } else if (last.s === 'crashed') {
      ctx.fillStyle = '#e11d48';
      ctx.beginPath();
      ctx.arc(lx, ly, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function bindEvents() {
    els.coin.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      registerTap(event.clientX, event.clientY);
    });
    els.coin.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (!event.repeat) registerTap();
      }
    });
    els.coin.addEventListener('contextmenu', (event) => event.preventDefault());

    els.launch.addEventListener('click', () => {
      haptic('medium');
      showArena(true);
    });
    els.back.addEventListener('click', () => showArena(false));

    els.depositLink.addEventListener('click', (event) => {
      event.preventDefault();
      openPaymentLink('deposit');
    });
    els.withdrawLink.addEventListener('click', (event) => {
      event.preventDefault();
      openPaymentLink('withdraw');
    });

    els.modalClose.addEventListener('click', closeModal);
    els.modal.addEventListener('click', (event) => {
      if (event.target === els.modal) closeModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !els.modal.hidden) closeModal();
    });

    document.addEventListener('gesturestart', (event) => event.preventDefault());
    document.addEventListener('dblclick', (event) => event.preventDefault(), { passive: false });

    window.addEventListener('resize', syncViewport);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      startDraw();
      if (!demo.active && everOpened && Date.now() - lastTickAt > 3000) {
        setNet('reconnecting');
        connectTicker();
      }
    });
  }

  setupTelegram();
  syncViewport();
  buildCards();
  bindEvents();
  renderTaps();
  connectTicker();
})();
</script>
</body>
</html>
